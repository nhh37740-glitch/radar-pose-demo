name: native-qt-build-test-delivery
on:
  push:
    paths: ['qt/**', '.github/workflows/qt-windows.yml']
  pull_request:
    paths: ['qt/**', '.github/workflows/qt-windows.yml']
  workflow_dispatch:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  native-qt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE/.tools/Qt" --archives qtbase qttools
      - name: Build native EXE and separate DLLs
        shell: pwsh
        run: ./qt/scripts/build.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64"
      - name: Prepare explicit 240-frame CI fixture
        shell: pwsh
        run: python qt/scripts/make_ci_recording.py --output qt/build/ci-recording
      - name: Test modules and actual native processes
        shell: pwsh
        run: ./qt/scripts/test.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64" -DataRoot qt/build/ci-recording -ExpectedCount 240
      - name: Package program runtime and verify delivered DLL interfaces
        shell: pwsh
        run: ./qt/scripts/package.ps1 -QtRoot "$env:GITHUB_WORKSPACE/.tools/Qt/6.8.3/msvc2022_64" -DataRoot qt/build/ci-recording -AppOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qt-program-and-test-evidence
          path: |
            qt/dist/*
            qt/build/module-tests.xml
            qt/build/process-evidence/
            qt/build/delivery-evidence/
